plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def minecraftVersionParts = project.minecraft_version.tokenize('.')
def nextMinecraftMajorVersion = ((minecraftVersionParts[0] ?: "0") as int) + 1
// Advertise compatibility from the current compile target up to, but not including, the next major line.
def minecraftVersionRange = ">=${project.minecraft_version} <${nextMinecraftMajorVersion}-"

fabricApi {
    configureDataGeneration() {
        client = true
    }
}

loom {
    runs {
        // Keep dev launches isolated from older mod jars left in previous run directories.
        client {
            runDir = "run-26.1.2"
        }

        server {
            runDir = "run-26.1.2"
        }
    }
}

repositories {
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation(fabricApi.module("fabric-renderer-api-v1", project.fabric_api_version))
    implementation(fabricApi.module("fabric-renderer-indigo", project.fabric_api_version))

    compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
    runtimeOnly "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_version_range", minecraftVersionRange
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"
    exclude ".cache/**"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "minecraft_version_range": minecraftVersionRange,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
def targetJavaLanguageVersion = JavaLanguageVersion.of(targetJavaVersion)
def targetJavaLauncher = javaToolchains.launcherFor {
    languageVersion = targetJavaLanguageVersion
}

tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

tasks.withType(net.fabricmc.loom.task.RunGameTask).configureEach {
    javaLauncher = targetJavaLauncher
}

java {
    toolchain {
        languageVersion = targetJavaLanguageVersion
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
